<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>受付・チェックイン管理</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f2f2ef;
      --surface: #ffffff;
      --ink: #171717;
      --muted: #6b6b67;
      --line: #d7d7d1;
      --line-strong: #a9a9a2;
      --accent: #145da0;
      --ok-bg: #e6f1e8;
      --ok: #275d38;
      --warn-bg: #f5efdc;
      --warn: #745b12;
      --error-bg: #f4e5e5;
      --error: #8a2f2f;
      --camera: #171717;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button { font: inherit; }

    /* ---------- モード選択 ---------- */
    #mode-selection {
      width: min(860px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 0;
    }

    #mode-selection::before {
      content: "EVENT OPERATIONS";
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    #mode-selection h1 {
      margin: 0 0 34px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.2;
      letter-spacing: -.03em;
      font-weight: 700;
    }

    .mode-button {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 24px 64px 24px 24px;
      border: 0;
      border-top: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-size: clamp(20px, 2.7vw, 28px);
      font-weight: 650;
      cursor: pointer;
      border-radius: 0;
      transition: background-color .12s ease;
    }

    .mode-button:last-child { border-bottom: 1px solid var(--line-strong); }
    .mode-button::after {
      content: "→";
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      font-weight: 400;
      color: var(--muted);
    }
    .mode-button:hover { background: #e8e8e4; }
    .mode-button:focus-visible { outline: 3px solid rgba(20, 93, 160, .25); outline-offset: -3px; }

    /* ---------- QR受付 ---------- */
    #qr-reader-view {
      display: none;
      width: 100vw;
      height: 100vh;
      background: var(--surface);
    }

    #left-panel,
    #right-panel {
      width: 50%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #left-panel {
      padding: clamp(28px, 4vw, 56px);
      justify-content: space-between;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    #left-panel::before {
      content: "CHECK-IN";
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    #scan-info {
      width: 100%;
      flex: 1;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #registered-id-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    #registered-id {
      display: block;
      margin-bottom: 24px;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: .02em;
    }

    #registered-name {
      display: block;
      min-height: 1.2em;
      color: var(--ink);
      font-size: clamp(30px, 2.6vw, 40px);
      line-height: 1.18;
      letter-spacing: -.04em;
      font-weight: 720;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }


    #subsidy-prompt {
      display: none;
      margin-top: 22px;
      padding: 10px 14px;
      border: 1px solid #dfd2a9;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: clamp(14px, 1.35vw, 18px);
      line-height: 1.45;
      font-weight: 650;
      text-align: center;
    }


    #status {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-left-width: 5px;
      border-radius: 0;
      background: #f5f5f2;
      color: var(--ink);
      font-size: clamp(15px, 1.6vw, 20px);
      line-height: 1.45;
      font-weight: 650;
      text-align: center;
    }

    .status-default { border-left-color: var(--line-strong) !important; background: #f5f5f2 !important; color: var(--ink) !important; }
    .status-checked { border-color: #bed3c3 !important; border-left-color: var(--ok) !important; background: var(--ok-bg) !important; color: var(--ok) !important; }
    .status-already { border-color: #dfd2a9 !important; border-left-color: var(--warn) !important; background: var(--warn-bg) !important; color: var(--warn) !important; }
    .status-error { border-color: #dfc0c0 !important; border-left-color: var(--error) !important; background: var(--error-bg) !important; color: var(--error) !important; }

    #right-panel {
      position: relative;
      justify-content: center;
      align-items: center;
      padding: 58px 28px 28px;
      background: var(--camera);
      overflow: hidden;
    }

    #reader-title {
      position: absolute;
      top: 20px;
      left: 24px;
      width: auto;
      padding: 0;
      color: #bcbcbc;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .1em;
      text-align: left;
    }

    #reader {
      width: min(100%, 760px);
      max-height: calc(100vh - 110px);
      margin: 0;
      overflow: hidden;
      background: #000;
      border: 1px solid #393939;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
    }

    .mirrored video { transform: scaleX(-1); }

    #mirror-toggle {
      position: absolute;
      right: 24px;
      bottom: 20px;
      z-index: 10;
      padding: 8px 10px;
      border: 1px solid #555;
      border-radius: 2px;
      background: #222;
      color: #cfcfcf;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #mirror-toggle:hover { background: #2c2c2c; color: #fff; }

    /* ---------- チェックイン状況 ---------- */
    #attendance-status-view {
      display: none;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg);
      padding: 46px 28px 70px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    #task-list-container {
      width: min(920px, 100%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    #task-list-container::before {
      content: "CHECK-IN STATUS";
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    #task-list-title {
      margin: 0 0 34px;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.2;
      letter-spacing: -.03em;
      font-weight: 720;
      text-align: left;
    }

    #task-list {
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line-strong);
    }

    .task-item {
      width: 100%;
      min-height: 78px;
      margin: 0;
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      font-size: clamp(18px, 2.1vw, 24px);
    }

    .task-name {
      color: var(--ink);
      font-weight: 650;
    }


    .status-tabs {
      display: flex;
      align-items: flex-end;
      gap: 28px;
      margin: -10px 0 26px;
      border-bottom: 1px solid var(--line-strong);
    }

    .status-tab {
      appearance: none;
      position: relative;
      margin: 0 0 -1px;
      padding: 13px 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-tab:hover { color: var(--ink); }
    .status-tab.active {
      border-bottom-color: var(--ink);
      color: var(--ink);
    }

    .tab-count {
      margin-left: 6px;
      color: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .task-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .task-meta {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .participant-flags {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .subsidy-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .subsidy-label.has-subsidy {
      color: var(--warn);
    }

    .task-side {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 15px;
      font-weight: 650;
      text-align: right;
      white-space: nowrap;
    }

    #no-tasks-message {
      margin-top: 30px;
      padding: 22px 0;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      text-align: center;
    }

    /* ---------- 小さい画面 ---------- */
    @media (max-width: 820px) {
      body { overflow: auto; }
      #qr-reader-view { min-height: 100vh; height: auto; flex-direction: column; }
      #left-panel, #right-panel { width: 100%; height: auto; min-height: 50vh; }
      #left-panel { padding: 32px 24px; }
      #right-panel { padding: 54px 18px 64px; }
      #registered-name {
        font-size: clamp(32px, 9vw, 48px);
        white-space: normal;
        word-break: normal;
        overflow-wrap: break-word;
      }
      #reader { max-height: none; }
      #mode-selection { width: min(100% - 32px, 860px); }
      #attendance-status-view { padding: 32px 20px 60px; }
      .status-tabs { gap: 18px; overflow-x: auto; }
      .status-tab { font-size: 15px; }
      .task-item { align-items: flex-start; }
      .task-side { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div id="mode-selection" style="display:flex;">
    <h1>受付端末</h1>
    <button class="mode-button" id="select-qr">QRコードでチェックイン</button>
    <button class="mode-button" id="select-status">チェックイン状況を確認</button>
  </div>

  <div id="qr-reader-view">
    <div id="left-panel">
      <div id="scan-info">
        <span id="registered-id-label">登録番号</span>
        <span id="registered-id">---</span>
        <span id="registered-name">QRコードをかざしてください</span>
        <span id="subsidy-prompt">受付で交通費補助の受取を行ってください</span>
      </div>
      <div id="status" class="status-default">Ready for the next scan</div>
    </div>

    <div id="right-panel">
      <div id="reader-title">QR CAMERA</div>
      <div id="reader"></div>
      <button id="mirror-toggle">左右反転 ON</button>
    </div>
  </div>

  <div id="attendance-status-view">
    <div id="task-list-container">
      <h1 id="task-list-title">チェックイン状況</h1>

      <div class="status-tabs" role="tablist" aria-label="チェックイン状況">
        <button class="status-tab active" id="tab-checked-in" data-tab="checkedIn" role="tab" aria-selected="true">
          チェックイン済み<span class="tab-count" id="count-checked-in">0</span>
        </button>
        <button class="status-tab" id="tab-unchecked" data-tab="unchecked" role="tab" aria-selected="false">
          未チェックイン<span class="tab-count" id="count-unchecked">0</span>
        </button>
      </div>

      <ul id="task-list"></ul>
      <div id="no-tasks-message">チェックイン済みの参加者はいません。</div>
    </div>
  </div>

  <script>
    const READER_ID = 'reader';
    let html5QrCode;
    let isProcessing = false;
    let currentMode = null;
    let pollingTimer = null;

    // ミラーリングの状態を管理（デフォルトはON）
    let isMirrored = (localStorage.getItem('isMirrored') === 'false') ? false : true;

    const modeSelectionEl = document.getElementById('mode-selection');
    const qrReaderViewEl = document.getElementById('qr-reader-view');
    const attendanceStatusViewEl = document.getElementById('attendance-status-view');

    // QRリーダーモード要素
    const registeredIdEl = document.getElementById('registered-id');
    const registeredNameEl = document.getElementById('registered-name');
    const statusEl = document.getElementById('status');
    const subsidyPromptEl = document.getElementById('subsidy-prompt');
    const mirrorToggleEl = document.getElementById('mirror-toggle');

    // チェックイン状況モード要素
    const taskListEl = document.getElementById('task-list');
    const noTasksMessageEl = document.getElementById('no-tasks-message');
    const statusTabEls = document.querySelectorAll('.status-tab');
    const countCheckedInEl = document.getElementById('count-checked-in');
    const countUncheckedEl = document.getElementById('count-unchecked');

    let activeStatusTab = 'checkedIn';
    let checkInOverview = { checkedIn: [], unchecked: [] };

    // =========================================================================
    // カメラのミラーリング制御
    // =========================================================================
    function updateMirrorState() {
      const readerEl = document.getElementById(READER_ID);
      if (isMirrored) {
        readerEl.classList.add('mirrored');
        mirrorToggleEl.textContent = '左右反転 ON';
      } else {
        readerEl.classList.remove('mirrored');
        mirrorToggleEl.textContent = '左右反転 OFF';
      }
      localStorage.setItem('isMirrored', isMirrored);
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      updateMirrorState();
    }

    // =========================================================================
    // 起動モード制御
    // =========================================================================
    function setMode(mode) {
      currentMode = mode;

      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }

      if (html5QrCode && html5QrCode.getState() !== 1) {
        html5QrCode.stop().catch(() => {});
      }

      modeSelectionEl.style.display = 'none';

      if (mode === 'qr') {
        qrReaderViewEl.style.display = 'flex';
        attendanceStatusViewEl.style.display = 'none';
        resetUI();
        startScan();
        updateMirrorState();
      } else if (mode === 'status') {
        qrReaderViewEl.style.display = 'none';
        attendanceStatusViewEl.style.display = 'flex';
        startStatusPolling();
      }
    }

    // =========================================================================
    // QRリーダーモード処理
    // =========================================================================
    const onScanSuccess = (decodedText, decodedResult) => {
      const registeredId = extractRegisteredId(decodedText);

      if (registeredId && !isProcessing) {
        isProcessing = true;

        registeredIdEl.textContent = registeredId;
        registeredNameEl.textContent = 'Loading...';
        statusEl.textContent = 'Registering...';
        statusEl.className = 'status-default';
        subsidyPromptEl.style.display = 'none';

        google.script.run
          .withSuccessHandler(handleCheckInResponse)
          .withFailureHandler(handleServerError)
          .checkInAndRecord(registeredId);
      }
    };

    function handleCheckInResponse(response) {
      registeredNameEl.textContent = response.name || '---';
      subsidyPromptEl.style.display = 'none';

      if (response.success) {
        const subsidyText = response.hasSubsidy ? '補助あり' : '補助なし';

        if (response.status === 'checked_in') {
          statusEl.textContent = `${response.message} (${subsidyText})`;
          statusEl.className = 'status-checked';
        } else if (response.status === 'already_checked') {
          statusEl.textContent = `${response.message} (${subsidyText})`;
          statusEl.className = 'status-already';
        }

        if (response.hasSubsidy) {
          subsidyPromptEl.style.display = 'block';
        }
      } else {
        statusEl.textContent = response.message;
        statusEl.className = 'status-error';
      }

      setTimeout(() => {
        resetUI();
        isProcessing = false;
      }, 3000);
    }

    // =========================================================================
    // チェックイン状況モード処理
    // =========================================================================
    function startStatusPolling() {
      fetchCheckInOverview();
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchCheckInOverview, 2000);
    }

    function fetchCheckInOverview() {
      google.script.run
        .withSuccessHandler(renderCheckInOverview)
        .withFailureHandler(handleStatusError)
        .getCheckInOverview();
    }

    function renderCheckInOverview(overview) {
      checkInOverview = {
        checkedIn: Array.isArray(overview?.checkedIn) ? overview.checkedIn : [],
        unchecked: Array.isArray(overview?.unchecked) ? overview.unchecked : []
      };

      countCheckedInEl.textContent = checkInOverview.checkedIn.length;
      countUncheckedEl.textContent = checkInOverview.unchecked.length;

      renderActiveStatusTab();
    }

    function setStatusTab(tabName) {
      activeStatusTab = tabName;

      statusTabEls.forEach(tab => {
        const isActive = tab.dataset.tab === tabName;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      renderActiveStatusTab();
    }

    function renderActiveStatusTab() {
      const items = checkInOverview[activeStatusTab] || [];
      taskListEl.innerHTML = '';

      const emptyMessages = {
        checkedIn: 'チェックイン済みの参加者はいません。',
        unchecked: '未チェックインの参加者はいません。'
      };

      if (items.length === 0) {
        noTasksMessageEl.textContent = emptyMessages[activeStatusTab];
        noTasksMessageEl.style.display = 'block';
        return;
      }

      noTasksMessageEl.style.display = 'none';

      items.forEach(item => {
        if (activeStatusTab === 'checkedIn') {
          renderCheckedInItem(item);
        } else {
          renderUncheckedItem(item);
        }
      });
    }

    function createTaskMain(item) {
      const main = document.createElement('div');
      main.className = 'task-main';

      const name = document.createElement('span');
      name.className = 'task-name';
      name.textContent = item.name || '---';

      const meta = document.createElement('span');
      meta.className = 'task-meta';
      meta.textContent = `ID ${item.id || '---'}`;

      main.appendChild(name);
      main.appendChild(meta);
      return main;
    }

    function createParticipantFlags(item, statusText) {
      const flags = document.createElement('div');
      flags.className = 'participant-flags';

      const side = document.createElement('span');
      side.className = 'task-side';
      side.textContent = statusText;

      const subsidy = document.createElement('span');
      subsidy.className = 'subsidy-label';
      subsidy.textContent = item.hasSubsidy ? '交通費補助あり' : '交通費補助なし';
      if (item.hasSubsidy) subsidy.classList.add('has-subsidy');

      flags.appendChild(side);
      flags.appendChild(subsidy);
      return flags;
    }

    function renderCheckedInItem(item) {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.appendChild(createTaskMain(item));

      const statusText = item.checkInTime ? `CHECK-IN ${item.checkInTime}` : 'CHECK-IN';
      li.appendChild(createParticipantFlags(item, statusText));

      taskListEl.appendChild(li);
    }

    function renderUncheckedItem(item) {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.appendChild(createTaskMain(item));
      li.appendChild(createParticipantFlags(item, 'NOT CHECKED IN'));
      taskListEl.appendChild(li);
    }

    function handleStatusError(error) {
      console.error('Check-in overview fetching error:', error);
      noTasksMessageEl.textContent = '【エラー】チェックイン状況の取得に失敗しました。2秒後に再試行します。';
      noTasksMessageEl.style.display = 'block';
    }

    // =========================================================================
    // 共通関数
    // =========================================================================
    function extractRegisteredId(url) {
      try {
        const urlObj = new URL(url);
        const pathParts = urlObj.pathname.split('/');
        const id = pathParts[pathParts.length - 2];
        return id && id.length > 5 ? id : null;
      } catch (e) {
        return null;
      }
    }

    function handleServerError(error) {
      if (currentMode === 'qr') {
        statusEl.textContent = 'システムエラー: ' + error.message;
        statusEl.className = 'status-error';
        registeredNameEl.textContent = '---';
        setTimeout(() => {
          resetUI();
          isProcessing = false;
        }, 3000);
      } else {
        console.error('Server error:', error);
        alert('致命的なサーバーエラー: ' + error.message);
      }
    }

    function resetUI() {
      registeredIdEl.textContent = '---';
      registeredNameEl.textContent = 'QRコードをかざしてください';
      statusEl.textContent = 'Ready for the next scan';
      statusEl.className = 'status-default';
      subsidyPromptEl.style.display = 'none';
    }

    function startScan() {
      if (currentMode !== 'qr') return;

      const config = {
        fps: 20,
        qrbox: { width: 200, height: 200 },
        disableFlip: false,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
      };

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          const cameraId = devices[0].id;
          html5QrCode.start(
            cameraId,
            config,
            onScanSuccess,
            (errorMessage) => { /* スキャンエラーは無視 */ }
          )
          .then(() => {
            statusEl.textContent = 'Ready for the next scan';
          })
          .catch(err => {
            statusEl.textContent = 'エラー：カメラの起動に失敗しました。';
            statusEl.className = 'status-error';
            console.error('Camera start failed:', err);
          });
        } else {
          statusEl.textContent = 'エラー：カメラが見つかりませんでした。';
          statusEl.className = 'status-error';
        }
      }).catch(err => {
        statusEl.textContent = '致命的エラー：カメラへのアクセスが拒否されました。';
        statusEl.className = 'status-error';
        console.error('Get cameras failed:', err);
      });
    }

    // =========================================================================
    // 画面ロード時の初期化
    // =========================================================================
    window.onload = () => {
      document.getElementById('select-qr').onclick = () => setMode('qr');
      document.getElementById('select-status').onclick = () => setMode('status');

      mirrorToggleEl.onclick = toggleMirror;
      statusTabEls.forEach(tab => {
        tab.onclick = () => setStatusTab(tab.dataset.tab);
      });

      html5QrCode = new Html5Qrcode(READER_ID);
      modeSelectionEl.style.display = 'flex';
    };
  </script>
</body>
</html>
